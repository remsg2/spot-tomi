<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sticker Tomi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{s}}px; height: {{s}}px; transform: rotate({{tilt}}deg); font-family: 'Archivo Black', 'Inter', sans-serif; color: #111111;">
  <div style="position: absolute; inset: 0; border-radius: {{r}}px; background: {{accent}}; overflow: hidden; box-shadow: {{shadow}};">
    <div style="position: absolute; left: 7%; top: {{tt}}px; font-size: {{tf}}px; line-height: 1; color: #111111; letter-spacing: 0.01em;">TOMI</div>
    <img src="/_blob/01b1335b3a99b5052365f175bd19ee71" alt="Tomi le chat" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;">
    <div style="position: absolute; inset: 0; background: #111111; clip-path: polygon(0 95%, 100% 64%, 100% 100%, 0 100%);"></div>
    <sc-if value="{{showSub}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; right: 7%; bottom: {{sb}}px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: {{sf}}px; line-height: 1; color: {{accent}};">{{sub}}</div>
    </sc-if>
    <div style="position: absolute; right: 7%; bottom: {{bb}}px; font-size: {{bf}}px; line-height: 1; color: {{accent}}; letter-spacing: 0.01em; white-space: nowrap;">{{band}}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5DB043","options":["#5DB043","#5B8DEF","#FF7A59","#F2C230"]},"size":{"editor":"int","default":320,"min":40,"max":800},"band":{"editor":"text","default":"2027"},"sub":{"editor":"text","default":"@tomi_lechat"},"gold":{"editor":"boolean","default":false},"tilt":{"editor":"float","default":0,"min":-20,"max":20},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Number(this.props.size ?? 320);
    const gold = this.props.gold === true || this.props.gold === 'true';
    const lift = '0 1px 2px rgba(0,0,0,0.20), 0 ' + Math.round(s * 0.04) + 'px ' + Math.round(s * 0.09) + 'px rgba(0,0,0,0.22)';
    const ring = gold ? ', 0 0 0 ' + Math.max(2, Math.round(s * 0.02)) + 'px #E9B52F, 0 0 ' + Math.round(s * 0.12) + 'px rgba(233,181,47,0.65)' : '';
    return {
      s,
      accent: this.props.accent ?? '#5DB043',
      band: this.props.band ?? '2027',
      sub: this.props.sub ?? '@tomi_lechat',
      showSub: s >= 140 && (this.props.sub ?? '@tomi_lechat') !== '',
      tilt: Number(this.props.tilt ?? 0),
      r: Math.max(3, Math.round(s * 0.035)),
      tt: Math.round(s * 0.07),
      tf: Math.round(s * 0.2),
      bb: Math.round(s * 0.05),
      bf: Math.round(s * 0.13),
      sb: Math.round(s * 0.215),
      sf: Math.max(7, Math.round(s * 0.042)),
      shadow: lift + ring
    };
  }
}
</script>
</body>
</html>
