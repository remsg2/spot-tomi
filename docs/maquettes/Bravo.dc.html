<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sticker collé</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 40px 20px 0; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 18px;">

  <span aria-hidden="true" style="position: absolute; left: 40px; top: 170px; width: 16px; height: 16px; border-radius: 3px; background: #E9B52F; transform: rotate(20deg);"></span>
  <span aria-hidden="true" style="position: absolute; left: 70px; top: 330px; width: 10px; height: 10px; border-radius: 2px; background: {{t.confetti}}; transform: rotate(-30deg);"></span>
  <span aria-hidden="true" style="position: absolute; right: 44px; top: 150px; width: 12px; height: 12px; border-radius: 2px; background: {{t.confetti}}; transform: rotate(35deg);"></span>
  <span aria-hidden="true" style="position: absolute; right: 60px; top: 360px; width: 18px; height: 18px; border-radius: 3px; background: #E9B52F; transform: rotate(-12deg);"></span>
  <span aria-hidden="true" style="position: absolute; right: 30px; top: 260px; width: 8px; height: 8px; border-radius: 2px; background: #FFFFFF; transform: rotate(10deg);"></span>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
    <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.05;">Sticker collé !</h1>
    <span style="font-size: 15px; font-weight: 600; color: {{t.sub}};">Ushuaïa, Argentine</span>
  </div>

  <div style="padding: 6px 0 4px;">
    <dc-import name="Sticker" size="220" tilt="6" band="+195" accent="{{accent}}" gold="{{yes}}" hint-size="220px,220px"></dc-import>
  </div>

  <div style="width: 100%; box-sizing: border-box; border-radius: 22px; background: {{t.panel}}; color: #F4F3EF; padding: 10px 18px 14px; display: flex; flex-direction: column;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 30px; font-size: 14px; opacity: {{r.o}};">
        <span style="font-weight: 500; color: #D9D8D2;">{{r.label}}</span>
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 15px; color: {{accent}};">{{r.v}}</span>
      </div>
    </sc-for>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; padding-top: 10px; border-top: 1px solid #34343A;">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;">Total</span>
      <span style="font-family: 'Archivo Black', sans-serif; font-size: 32px; line-height: 1; color: {{accent}};">195 pts</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: {{t.chip}}; color: #121212; font-size: 14px; font-weight: 700;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
    Tu passes 2ᵉ du classement
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; gap: 10px;">
    <a href="Carte.dc.html" style="flex: 1.4; height: 56px; border-radius: 18px; background: #111111; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 16px; box-shadow: {{t.btnRing}};">Voir sur la carte</a>
    <button type="button" style="flex: 1; height: 56px; border-radius: 18px; border: 2px solid {{t.outline}}; background: transparent; color: {{t.text}}; font: 700 15px 'Inter', sans-serif;">Partager</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#5DB043","options":["#5DB043","#5B8DEF","#FF7A59","#F2C230"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const a = this.props.accent ?? '#5DB043';
    const t = dark
      ? { bg: '#0E0E10', text: '#F4F3EF', sub: '#A6A5A0', panel: '#1A1A1D', chip: a, confetti: a, outline: '#F4F3EF', btnRing: '0 0 0 1px #3A3A40' }
      : { bg: a, text: '#111111', sub: '#111111', panel: '#111111', chip: '#FFFFFF', confetti: '#111111', outline: '#111111', btnRing: 'none' };
    const rows = [
      { label: 'Pays lointain', v: '25', o: 1 },
      { label: 'Premier sticker du pays', v: '+50', o: 1 },
      { label: 'Première ville', v: '+15', o: 1 },
      { label: 'Isolement', v: '+40', o: 1 },
      { label: 'Loin de chez toi', v: '+65', o: 0.55 }
    ];
    return { dark, accent: a, t, rows, yes: true };
  }
}
</script>
</body>
</html>
