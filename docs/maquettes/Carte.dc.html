    <div style="display: flex; gap: 8px;">

    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Album</a>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#5DB043","options":["#5DB043","#5B8DEF","#FF7A59","#F2C230"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const a = this.props.accent ?? '#5DB043';
    const t = dark
      ? { text: '#F4F3EF', muted: '#A6A5A0', card: '#1A1A1D', cardA: '#1A1A1D', line: '#2E2E33', water: '#0B0C0E', land: '#222226', coast: '#34343A', label: '#62626A', shadow: '0 2px 10px rgba(0,0,0,0.45)', shadowLg: '0 12px 32px rgba(0,0,0,0.6)' }
      : { text: '#121212', muted: '#5C5B57', card: '#FFFFFF', cardA: '#FFFFFF', line: '#E2DFD6', water: '#DEDCD3', land: '#FBFAF7', coast: '#CFCBC0', label: '#A19E95', shadow: '0 2px 10px rgba(30,25,10,0.12)', shadowLg: '0 12px 32px rgba(30,25,10,0.18)' };
    const Y = { 2024: '#F2C230', 2025: '#FF7A59', 2026: '#5B8DEF', 2027: a };
    const raw = [
      [37, 266, 34, '38', 2027], [128, 194, 34, '41', 2027], [176, 312, 34, '24', 2026], [255, 290, 26, '', 2025],
      [154, 414, 26, '', 2027], [169, 468, 26, '', 2024], [262, 501, 26, '', 2026], [212, 542, 26, '', 2025],
      [44, 547, 26, '', 2027], [36, 596, 34, '22', 2026], [85, 618, 34, '30', 2027], [359, 393, 26, '', 2027],
      [285, 446, 34, '53', 2027, true, true]
    ];
    const markers = raw.map(([x, y, s, pts, yr, gold, sel]) => ({
      l: x - (s + 16) / 2, t: y - (s + 16) / 2, s, pts, c: Y[yr], gold: !!gold, sel: !!sel, hs: (s + 16) + 'px,' + (s + 16) + 'px'
    }));
    return { dark, accent: a, t, markers, yes: true };
  }
}
</script>
