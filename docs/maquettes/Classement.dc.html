<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Classement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 20px 16px 0; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 28px;">Classement</h1>
    <div role="group" aria-label="Période" style="display: flex; padding: 3px; border-radius: 12px; background: {{t.soft}};">
      <button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: {{accent}}; color: #111111; font: 800 13px 'Inter', sans-serif;">2027</button>
      <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: {{t.muted}}; font: 600 13px 'Inter', sans-serif;">Toujours</button>
    </div>
  </div>
  <div style="display: flex; gap: 8px;">
    <button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: {{t.text}}; color: {{t.bg}}; font: 700 13px 'Inter', sans-serif;">Points</button>
    <button type="button" style="height: 34px; padding: 0 14px; border: 1px solid {{t.line}}; border-radius: 999px; background: {{t.card}}; color: {{t.text}}; font: 600 13px 'Inter', sans-serif;">Pays</button>
    <button type="button" style="height: 34px; padding: 0 14px; border: 1px solid {{t.line}}; border-radius: 999px; background: {{t.card}}; color: {{t.text}}; font: 600 13px 'Inter', sans-serif;">Stickers</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; padding-top: 6px;">
    <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <span style="position: relative; width: 54px; height: 54px; border-radius: 999px; background: {{p.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 20px; box-shadow: {{p.ring}};">{{p.ini}}</span>
        <div style="display: flex; flex-direction: column; align-items: center;">
          <span style="font-size: 14px; font-weight: 700;">{{p.name}}</span>
          <span style="font-family: 'Archivo Black', sans-serif; font-size: 15px;">{{p.pts}}</span>
        </div>
        <div style="position: relative; width: 100%; height: {{p.h}}px; background: #111111; border-radius: 4px 4px 0 0; clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center;">
          <span style="font-family: 'Archivo Black', sans-serif; font-size: 34px; color: {{p.c}}; padding-top: 10px;">{{p.rank}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: -6px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 14px; border-radius: 16px; background: {{t.card}}; border: 1px solid {{t.line}};">
        <span style="width: 20px; font-family: 'Archivo Black', sans-serif; font-size: 15px; color: {{t.muted}};">{{r.rank}}</span>
        <span style="width: 36px; height: 36px; border-radius: 999px; background: {{r.av}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;">{{r.ini}}</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
          <span style="font-size: 15px; font-weight: 700;">{{r.name}}</span>
          <span style="font-size: 12px; color: {{t.muted}};">{{r.sub}}</span>
        </div>
        <span style="font-family: 'Archivo Black', sans-serif; font-size: 17px;">{{r.pts}}</span>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding: 0 10px 14px; box-sizing: border-box; background: {{t.card}}; border-top: 1px solid {{t.line}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="Carte.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Carte</a>
    <a href="Classement.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; color: {{t.text}}; text-decoration: none; font-size: 11px; font-weight: 700;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Classement</a>
    <a href="Ajout.dc.html" aria-label="Ajouter un sticker" style="justify-self: center; position: relative; top: -16px; width: 62px; height: 62px; border-radius: 18px; background: {{accent}}; color: #111111; overflow: hidden; transform: rotate(-5deg); box-shadow: 0 0 0 4px {{t.card}}, 0 8px 18px rgba(0,0,0,0.28); display: flex; align-items: center; justify-content: center;">
      <span style="position: absolute; inset: 0; background: #111111; clip-path: polygon(0 100%, 0 88%, 100% 58%, 100% 100%);"></span>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="position: relative; margin-top: -8px;"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Album</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#5DB043","options":["#5DB043","#5B8DEF","#FF7A59","#F2C230"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const a = this.props.accent ?? '#5DB043';
    const t = dark
      ? { bg: '#0E0E10', text: '#F4F3EF', muted: '#A6A5A0', card: '#1A1A1D', soft: '#232327', line: '#2E2E33' }
      : { bg: '#F3F1EB', text: '#121212', muted: '#5C5B57', card: '#FFFFFF', soft: '#E7E4DC', line: '#E2DFD6' };
    const edge = dark ? '#0E0E10' : '#F3F1EB';
    const podium = [
      { rank: '2', name: 'Rémi · toi', ini: 'R', pts: '1 435', h: 96, av: '#111111', c: a, ring: '0 0 0 3px ' + edge + ', 0 0 0 6px ' + a },
      { rank: '1', name: 'Léa', ini: 'L', pts: '1 480', h: 128, av: '#7A4FD8', c: '#E9B52F', ring: '0 0 0 3px ' + edge + ', 0 0 0 6px #E9B52F, 0 0 16px rgba(233,181,47,0.6)' },
      { rank: '3', name: 'Hugo', ini: 'H', pts: '1 315', h: 76, av: '#C2410C', c: '#FFFFFF', ring: '0 0 0 3px ' + edge }
    ];
    const rows = [
      { rank: '4', name: 'Camille', ini: 'C', sub: '12 stickers · 6 pays', pts: '980', av: '#0F766E' },
      { rank: '5', name: 'Nico', ini: 'N', sub: '15 stickers · 4 pays', pts: '760', av: '#1D4ED8' },
      { rank: '6', name: 'Inès', ini: 'I', sub: '9 stickers · 5 pays', pts: '615', av: '#BE185D' },
      { rank: '7', name: 'Paul', ini: 'P', sub: '11 stickers · 3 pays', pts: '540', av: '#4D7C0F' },
      { rank: '8', name: 'Jade', ini: 'J', sub: '6 stickers · 3 pays', pts: '410', av: '#6D28D9' }
    ];
    return { dark, accent: a, t, podium, rows };
  }
}
</script>
</body>
</html>
