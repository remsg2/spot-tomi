<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Spot Tomi · web, mode sombre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: #0E0E10;">
  <dc-import name="Web" dark="{{yes}}" panel="classement" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5DB043","options":["#5DB043","#5B8DEF","#FF7A59","#F2C230"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, accent: this.props.accent ?? '#5DB043' };
  }
}
</script>
</body>
</html>
