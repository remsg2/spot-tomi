<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <h1 style="font-size: 22px; margin: 0 0 16px;">Ton code Spot Tomi</h1>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 16px;">Tape ce code dans Spot Tomi pour te connecter :</p>
  <p style="font-family: ui-monospace, Menlo, monospace; font-size: 34px; font-weight: 700; letter-spacing: 8px; margin: 0 0 16px;">{{ .Token }}</p>

  <p style="font-size: 13px; line-height: 1.5; color: #666; margin: 0;">Sur ordinateur, tu peux aussi <a href="{{ .ConfirmationURL }}" style="color: #1a1a1a;">te connecter avec ce lien</a>, à ouvrir dans le navigateur où tu as demandé le code.</p>
</div>
