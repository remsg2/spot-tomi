# Données de démo sur Supabase DEV uniquement (jamais la prod) : saisons d'exemple,
# 8 comptes demo_* et des stickers répartis dans le monde (supabase/seed.sql).
#
# Rejouable : complète jusqu'à la cible sans dépasser (par lots de 500).
# Lancement : Actions → « Données de démo (dev) » → Run workflow.
name: Données de démo (dev)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Nombre total de stickers de démo voulu"
        required: true
        default: "5000"
        type: string

permissions:
  contents: read

concurrency:
  group: demo-dev
  cancel-in-progress: false

jobs:
  demo:
    name: Remplir Supabase dev
    runs-on: ubuntu-latest
    # Environnement GitHub « dev » : il ne contient que la référence du projet dev.
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: "3.2.0"
      - name: Cible valide
        run: |
          [[ "$TARGET" =~ ^[0-9]+$ ]] && [ "$TARGET" -le 20000 ] || { echo "::error::Cible invalide : $TARGET"; exit 1; }
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Saisons et générateur de démo
        run: supabase db query --remote --yes --file supabase/seed.sql
      - name: Stickers de démo (par lots de 500)
        run: |
          for lot in $(seq 1 $(( TARGET / 500 + 2 ))); do
            echo "Lot $lot"
            supabase db query --remote --yes "select public.seed_demo_spots(least(500, greatest(0, $TARGET - (select count(*)::int from public.spots where author_id::text like 'de300000-0000-4000-8000-%')))) as ajoutes"
          done
      - name: Classement
        run: supabase db query --remote --yes "select public.refresh_leaderboard()"
      - name: Bilan
        run: |
          supabase db query --remote --read-only "select status, count(*) from public.spots where author_id::text like 'de300000-0000-4000-8000-%' group by status order by status"
