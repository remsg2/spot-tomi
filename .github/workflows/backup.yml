# Sauvegarde quotidienne de la base de production (cahier des charges 16), chiffrée.
#
# - Base : rôles, schéma et données (dont comptes Auth et index Storage), avec la CLI
#   Supabase. Archive chiffrée AES-256 (gpg, phrase secrète BACKUP_PASSPHRASE de
#   l'environnement « production »), gardée 30 jours comme artifact du workflow.
# - Photos (le dimanche, ou à la demande) : copie des buckets spot-photos, avatars et
#   editions, chiffrée de la même façon.
#
# Restauration : docs/sauvegardes.md. La sauvegarde n'est utile que si la restauration
# a été essayée : la tester sur un projet vide au moins une fois par trimestre.
name: Sauvegarde

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      photos:
        description: "Copier aussi les photos (Storage)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Jamais pendant un déploiement (migrations) : la sauvegarde serait incohérente.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backup:
    name: Base de production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # « auto » (planifié) : photos le dimanche seulement.
      PHOTOS: ${{ github.event_name == 'schedule' && 'auto' || inputs.photos }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: "3.2.0"
      - name: Phrase secrète présente
        run: |
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "::error::Secret BACKUP_PASSPHRASE absent ou trop court (20 caractères minimum)"; exit 1; }
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Export de la base
        run: |
          mkdir -p backup
          supabase db dump --linked --role-only -f backup/roles.sql
          supabase db dump --linked -f backup/schema.sql
          supabase db dump --linked --data-only --use-copy -f backup/data.sql
          supabase db query --remote --yes "select public.schema_version() as version, (select count(*) from public.spots) as stickers, (select count(*) from public.profiles) as membres" > backup/bilan.txt
          cat backup/bilan.txt
          ls -l backup

      - name: Photos (Storage)
        if: env.PHOTOS != 'false'
        run: |
          if [ "$PHOTOS" = "auto" ] && [ "$(date -u +%u)" != "7" ]; then echo "Pas dimanche : photos ignorées"; exit 0; fi
          for bucket in spot-photos avatars editions; do
            mkdir -p "backup/storage/$bucket"
            supabase storage cp --linked --experimental -r "ss:///$bucket" "backup/storage/$bucket" || echo "::warning::Bucket $bucket non copié"
          done
          du -sh backup/storage/* || true

      - name: Chiffrement
        run: |
          name="spot-tomi-$(date -u +%Y-%m-%dT%H%MZ)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup "$name.tar.gz"
          sha256sum "$name.tar.gz.gpg" | tee "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz.gpg
            ${{ env.NAME }}.sha256
          retention-days: 30
          if-no-files-found: error
