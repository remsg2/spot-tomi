# Déploiement (sans environnement de staging).
#
# Sur chaque merge dans main :
#   1. les migrations sont appliquées sur Supabase dev (une migration cassée
#      échoue ici, avant de toucher la prod) ;
#   2. migrations et fonctions sur Supabase prod, build Vercel, contrôle du
#      bundle, déploiement en production, puis tests contre le site en ligne.
#
# Les réglages Auth versionnés (supabase/auth.json) sont appliqués aux deux
# projets juste après les migrations (scripts/supabase-auth-config.sh).
#
# La CLI Supabase v3 vise la base locale par défaut : `--remote` cible le
# projet lié par `supabase link`, et `--yes` confirme les changements distants.
#
# L'environnement GitHub « production » peut exiger une validation manuelle
# (Required reviewers) : le job attend alors ton feu vert.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  VERCEL_CLI_VERSION: "66.6.0"
  SUPABASE_CLI_VERSION: "3.2.0"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Adresse publique de la production (modifiable par la variable de dépôt du même nom).
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://spot-tomi.vercel.app' }}

jobs:
  dev:
    name: Supabase dev · migrations et fonctions
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Réglages Auth (supabase/auth.json)
        run: scripts/supabase-auth-config.sh "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Fonctions Edge
        run: |
          if compgen -G "supabase/functions/*/index.ts" > /dev/null; then
            supabase functions deploy --yes
          else
            echo "Aucune fonction Edge à déployer."
          fi

  production:
    name: Production · migrations, build et déploiement
    needs: dev
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Migrations d'abord : elles doivent rester compatibles avec l'app en place.
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Réglages Auth (supabase/auth.json)
        run: scripts/supabase-auth-config.sh "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Fonctions Edge
        run: |
          if compgen -G "supabase/functions/*/index.ts" > /dev/null; then
            supabase functions deploy --yes
          else
            echo "Aucune fonction Edge à déployer."
          fi

      - name: Réglages du projet Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: vercel build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Aucune URL Supabase dans le bundle client
        run: node scripts/check-bundle.mjs .vercel/output/static
      - name: vercel deploy --prebuilt --prod
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Juste après `vercel deploy`, l'adresse publique peut encore servir l'ancienne
      # build quelques secondes : on réessaie jusqu'à ce qu'elle serve CE commit,
      # en bonne santé et branchée sur la base de prod. La réponse est toujours affichée.
      - name: Contrôle de santé de la production
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o health.json -w "%{http_code}" "$PRODUCTION_URL/api/health") || code=000
            echo "Tentative $attempt : HTTP $code"
            cat health.json 2>/dev/null; echo
            if jq -e --arg sha "${{ github.sha }}" --arg host "${{ vars.SUPABASE_PROJECT_REF }}.supabase.co" \
              '.status == "ok" and .appEnv == "production" and .buildId == $sha and .supabaseHost == $host' \
              health.json > /dev/null 2>&1; then
              echo "Production saine, build $GITHUB_SHA en ligne."
              exit 0
            fi
            sleep 10
          done
          echo "::error::La production ne sert pas la build attendue ou n'est pas en bonne santé."
          exit 1
      # Uniquement des tests en lecture seule : ils tournent sur le vrai site.
      - name: Playwright contre la production
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_APP_ENV: production
          EXPECTED_BUILD_ID: ${{ github.sha }}
          EXPECTED_SUPABASE_HOST: ${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
